    }

    }

    a:hover {
      opacity: 0.9;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
      border-radius: 4px;
    }

      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;

    }

      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .logo span {
      color: var(--violet);
    }

    .nav-links {
      display: none;
      gap: 2rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-link {
      color: var(--muted);
      font-size: 0.95rem;

    }

    .nav-link:hover {

    }

    .hero p {

      color: var(--muted);

      line-height: 1.8;
    }
